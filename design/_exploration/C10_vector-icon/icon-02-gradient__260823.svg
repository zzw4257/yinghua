<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1024" height="1024"
     viewBox="0 0 1024 1024"
     shape-rendering="geometricPrecision">

  <!-- ============================================================
       Yinghua · App Icon 02 GRADIENT — master SVG
       Date:        2026-08-23
       Source spec: design/design-doc.md §3.2 + C07 _audit-verdict.md
       C07 audit fixes applied:
         #1 [高]  single <path>, all three Y strokes meet at (512, 416)
                  with no seam — the worst bug in C07's 02 raster, now
                  fixed via the same V+stem topology as 01
         #2 [高]  identical Y master as 01 MINIMAL; only fill changes
         #4 [中]  same stroke-width 58 as 01 (uniform across variants)
       ============================================================ -->

  <title>Yinghua App Icon — 02 GRADIENT</title>
  <desc>macOS 26+ squircle 1024x1024, 22.4% corner radius. Aurora-purple-to-teal Y on near-black with a subtle 15% gradient wash background. Uses the same Y master path as 01 MINIMAL — only the stroke fill changes. Gradient direction 135deg (top-left → bottom-right), three stops: #B57BFF → #8A5BFF → #2DD4BF.</desc>

  <defs>
    <!-- Y stroke gradient: vivid aurora purple → mid purple → vivid teal,
         135deg diagonal (top-left → bottom-right), per D1 §3.2. -->
    <linearGradient id="yGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#B57BFF" />
      <stop offset="50%"  stop-color="#8A5BFF" />
      <stop offset="100%" stop-color="#2DD4BF" />
    </linearGradient>

    <!-- Background wash: same hue pair at 15% opacity, diagonal.
         Drawn on top of the solid #0A0A0F base to give the
         "glass + aurora tint" feel without going glassmorphic. -->
    <linearGradient id="bgWash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#B57BFF" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0.15" />
    </linearGradient>
  </defs>

  <!-- Solid near-black base -->
  <rect x="0" y="0" width="1024" height="1024"
        rx="229.376" ry="229.376"
        fill="#0A0A0F" />

  <!-- Aurora wash on top, same squircle clip, ~15% opacity -->
  <rect x="0" y="0" width="1024" height="1024"
        rx="229.376" ry="229.376"
        fill="url(#bgWash)" />

  <!-- Y master path: IDENTICAL geometry to 01 MINIMAL.
       V+stem topology — both subpaths meet at (512, 416), no seam.
       Only the stroke color changes (gradient instead of warm white). -->
  <path d="M 372 256 L 512 416 L 652 256 M 512 416 L 512 768"
        fill="none"
        stroke="url(#yGradient)"
        stroke-width="58"
        stroke-linecap="round"
        stroke-linejoin="round" />

</svg>
