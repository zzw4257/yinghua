name: Yinghua
options:
  bundleIdPrefix: app.yinghua
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true
  developmentLanguage: zh-Hans

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    # Code signing (C33)
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    DEVELOPMENT_TEAM: "${DEVELOPMENT_TEAM_ID}"   # 从环境变量读
    PRODUCT_BUNDLE_IDENTIFIER: app.yinghua.Yinghua
    ENABLE_HARDENED_RUNTIME: YES
    OTHER_CODE_SIGN_FLAGS: "--deep"
    # Build hygiene
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ANALYZER_NONNULL: YES
    CLANG_ENABLE_OBJC_ARC: YES
    DEAD_CODE_STRIPPING: YES
    COMBINE_HIDPI_IMAGES: YES

targets:
  Yinghua:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Yinghua
        excludes:
          - "**/*.md"
    resources:
      - path: Yinghua/Resources/Assets.xcassets
      - path: Yinghua/PrivacyInfo.xcprivacy
        type: file
        buildPhase: resources
    info:
      path: Yinghua/Info.plist
      properties:
        CFBundleName: Yinghua
        CFBundleDisplayName: 映话
        CFBundleIdentifier: app.yinghua.Yinghua
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        CFBundlePackageType: APPL
        LSMinimumSystemVersion: "26.0"
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "© 2026 Yinghua Inc."
        # Privacy usage descriptions (C13 + C33)
        NSMicrophoneUsageDescription: "映话 needs microphone access to record your voice during meetings."
        NSScreenCaptureUsageDescription: "映话 needs screen recording access to capture system audio from meetings."
        NSSpeechRecognitionUsageDescription: "映话 uses on-device speech recognition to transcribe your meetings in real time."
        NSAppleEventsUsageDescription: "映话使用 Apple Events 自动化控制会议应用。"
        NSUserNotificationUsageDescription: "映话 can notify you when a meeting ends and your AI summary is ready."
        # C48: Apple Shortcuts / App Intents support
        NSSupportsAppIntents: true
    entitlements:
      path: Yinghua/Yinghua.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.device.audio-input: true
        com.apple.security.device.microphone: true
        com.apple.security.network.client: true
        com.apple.security.network.server: false
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.downloads.read-write: true
        com.apple.security.print: false
    settings:
      base:
        INFOPLIST_FILE: Yinghua/Info.plist
        CODE_SIGN_ENTITLEMENTS: Yinghua/Yinghua.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"

schemes:
  Yinghua:
    build:
      targets:
        Yinghua: all
    run:
      config: Debug
      askForAppToLaunch: false
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
